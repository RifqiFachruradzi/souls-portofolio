<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ashen One</title>
<style>html,body{margin:0;height:100%;background:#050404}</style>
</head>
<body>
<script>
/* Split views of ThreeUI's Dark Souls Holo Card ("The Ashen One").
   The canonical document is fetched untouched and written into this frame with a small addendum:
     ?mode=shrine  hides the card group, leaving the candlelit sword shrine as an ambient scene;
     ?mode=card    makes the shrine assets unresolvable, so the scene falls back to its own
                   authored plain room and shows the card alone.
   Overlay text is hidden in both. The parent is told when the scene is ready and can pause it
   (the scene's own state.frozen / resume()). This frame is sandboxed (opaque origin), so the
   document is served with CORS headers. */
(function () {
  var SOURCE = "/landing-pages/dark-souls-holo-card.html";
  var MODE = new URLSearchParams(location.search).get("mode") === "card" ? "card" : "shrine";
  function addendum(mode) {
    var paused = false;
    var notify = function (type, detail) {
      try { parent.postMessage({ source: "holo-scene", mode: mode, type: type, detail: detail || null }, "*"); } catch (e) {}
    };
    if (mode === "card") {
      // runs after the inline asset tables and before the module: every shrine lookup throws,
      // createShrine rejects, and the scene keeps the plain room
      window.__SHRINE_ASSETS = new Proxy({}, { get: function () { throw new Error("shrine disabled for the card-only view"); } });
    }
    var apply = function () {
      var h = window.__holo;
      if (!h || !h.ready) return;
      if (paused) h.state.frozen = true;
      else h.resume();
    };
    addEventListener("message", function (event) {
      var data = event.data;
      if (!data || data.target !== "holo-scene") return;
      paused = data.type === "pause";
      apply();
    });
    var tick = function () {
      var h = window.__holo;
      if (mode === "shrine" && h && h.root) h.root.visible = false;
      if (h && h.error) return notify("error", h.error);
      if (h && h.ready) {
        apply();
        return notify("ready");
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  var inject =
    "<style>.mark,.hint,#loading{display:none!important}" + (MODE === "shrine" ? "#scene{cursor:default!important}" : "") + "</style>" +
    "<script>(" + addendum.toString() + ")(" + JSON.stringify(MODE) + ");<\/script>";
  fetch(SOURCE)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      var at = html.lastIndexOf("</body>");
      html = at === -1 ? html + inject : html.slice(0, at) + inject + html.slice(at);
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      try { parent.postMessage({ source: "holo-scene", mode: MODE, type: "error", detail: String(err) }, "*"); } catch (e) {}
    });
})();
</script>
</body>
</html>
