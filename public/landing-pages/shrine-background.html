<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sword shrine background</title>
<style>html,body{margin:0;height:100%;background:#050404}</style>
</head>
<body>
<script>
/* Background-only view of ThreeUI's Dark Souls Holo Card ("The Ashen One").
   The canonical document is fetched untouched and written into this frame with a small
   addendum that hides the card group and the overlay text, leaving the candlelit sword
   shrine as an ambient scene. The parent is told when the scene is ready and can pause it.
   This frame is sandboxed (opaque origin), so the document is served with CORS headers. */
(function () {
  var SOURCE = "/landing-pages/dark-souls-holo-card.html";
  function addendum() {
    var paused = false;
    var notify = function (type, detail) {
      try { parent.postMessage({ source: "shrine-background", type: type, detail: detail || null }, "*"); } catch (e) {}
    };
    var apply = function () {
      var h = window.__holo;
      if (!h || !h.ready) return;
      if (paused) h.state.frozen = true;
      else h.resume();
    };
    // the parent pauses the scene while the hero is offscreen; frozen stops the loop and its watchdog
    addEventListener("message", function (event) {
      var data = event.data;
      if (!data || data.target !== "shrine-background") return;
      paused = data.type === "pause";
      apply();
    });
    var tick = function () {
      var h = window.__holo;
      if (h && h.root) h.root.visible = false;
      if (h && h.error) return notify("error", h.error);
      if (h && h.ready) {
        apply();
        return notify("ready");
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  var inject =
    "<style>.mark,.hint,#loading{display:none!important}#scene{cursor:default!important}</style>" +
    "<script>(" + addendum.toString() + ")();<\/script>";
  fetch(SOURCE)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      var at = html.lastIndexOf("</body>");
      html = at === -1 ? html + inject : html.slice(0, at) + inject + html.slice(at);
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      try { parent.postMessage({ source: "shrine-background", type: "error", detail: String(err) }, "*"); } catch (e) {}
    });
})();
</script>
</body>
</html>
